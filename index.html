<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Dressing</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-brown: #6b4c35;
      --accent-hover: #523927;
      --beige-light: #f4eee8;
      --beige-border: #e6dad0;
      --text-dark: #2c221e;
      --text-muted: #7a6b63;
      --badge-dirty: #c26d5c;
      --badge-clean: #73907c;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow: 0 8px 24px rgba(107, 76, 53, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Écran d'authentification */
    #auth-screen {
      max-width: 420px;
      margin: 60px auto;
      background: var(--card-bg);
      padding: 35px 25px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      text-align: center;
    }
    #auth-screen h2 {
      color: var(--accent-brown);
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 25px;
      font-size: 1.4rem;
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: 2px solid var(--beige-border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .btn-google:hover { background: var(--beige-light); }

    .auth-divider {
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      position: relative;
    }

    /* Application principale */
    #app-screen { display: none; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--accent-brown);
      text-transform: uppercase;
      font-size: 1.5rem;
    }
    .btn-logout {
      background: var(--beige-light);
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--accent-brown);
      cursor: pointer;
      font-weight: 500;
    }

    nav {
      display: flex;
      background: var(--beige-light);
      padding: 6px;
      border-radius: var(--radius-lg);
      margin-bottom: 25px;
    }
    nav button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 10px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s;
    }
    nav button.active {
      background: var(--card-bg);
      color: var(--accent-brown);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Formulaires */
    .form-container {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group { margin-bottom: 18px; text-align: left; }
    label { display: block; font-size: 0.9rem; font-weight: 500; color: var(--accent-brown); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--beige-light);
      border-radius: var(--radius-md);
      background: var(--bg-color);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-dark);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-brown); }
    
    button.btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent-brown);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }

    /* Filtres */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid var(--beige-border);
      background: var(--card-bg);
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--accent-brown);
      color: #fff;
      border-color: var(--accent-brown);
    }

    /* Grille Dressing */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card img { width: 100%; height: 200px; object-fit: cover; background: var(--beige-light); }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: white;
    }
    .badge.clean { background: var(--badge-clean); }
    .badge.dirty { background: var(--badge-dirty); }

    .card-actions { margin-top: auto; display: flex; gap: 8px; }
    .card-actions button {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      border: none;
      background: var(--beige-light);
      color: var(--accent-brown);
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .card-actions button.btn-delete { background: #fff0ed; color: #c26d5c; flex: 0.35; }

    /* Éditeur */
    .editor-layout { display: flex; gap: 20px; flex-direction: column; }
    @media (min-width: 768px) { .editor-layout { flex-direction: row; } }
    
    .editor-canvas-container {
      flex: 2;
      background: var(--card-bg);
      border: 3px dashed var(--beige-border);
      border-radius: var(--radius-lg);
      min-height: 480px;
      position: relative;
      overflow: hidden;
    }
    .editor-canvas-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--beige-border);
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
    }
    .editor-inventory {
      flex: 1;
      background: var(--beige-light);
      padding: 15px;
      border-radius: var(--radius-lg);
      height: 480px;
      overflow-y: auto;
    }
    .inventory-item {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .inventory-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }

    .canvas-item {
      position: absolute;
      top: 25%;
      left: 25%;
      cursor: grab;
      user-select: none;
    }
    .canvas-item img { width: 140px; height: auto; border-radius: var(--radius-md); pointer-events: none; }
    .canvas-item-close {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #c26d5c;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN D'AUTHENTIFICATION -->
  <div id="auth-screen">
    <h2>Mon Dressing</h2>
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continuer avec Google
    </button>

    <div class="auth-divider">ou par e-mail</div>

    <form onsubmit="handleEmailAuth(event)">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="auth-email" required>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" required>
      </div>
      <button type="submit" class="btn-primary" id="btn-auth-submit">Se connecter / S'inscrire</button>
    </form>
  </div>

  <!-- ÉCRAN PRINCIPAL DRESSING -->
  <div id="app-screen">
    <header>
      <h1>Mon Dressing</h1>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </header>

    <nav>
      <button class="active" onclick="switchTab('dressing')">Garde-robe</button>
      <button onclick="switchTab('editor')">Créer une tenue</button>
      <button onclick="switchTab('add')">+ Ajouter</button>
    </nav>

    <!-- Onglet Garde-robe -->
    <div id="tab-dressing" class="tab-content active">
      <div class="filters">
        <button class="filter-btn active" onclick="filterItems('all', this)">Tout</button>
        <button class="filter-btn" onclick="filterItems('Haut', this)">Hauts</button>
        <button class="filter-btn" onclick="filterItems('Bas', this)">Bas</button>
        <button class="filter-btn" onclick="filterItems('Chaussures', this)">Chaussures</button>
        <button class="filter-btn" onclick="filterItems('Manteau', this)">Manteaux</button>
        <button class="filter-btn" onclick="filterItems('Accessoire', this)">Accessoires</button>
        <button class="filter-btn" onclick="filterItems('dirty', this)">Panier à Linge</button>
      </div>
      <div id="clothes-grid" class="grid"></div>
    </div>

    <!-- Onglet Éditeur -->
    <div id="tab-editor" class="tab-content">
      <div class="editor-layout">
        <div class="editor-canvas-container" id="editor-canvas">
          <div class="editor-canvas-hint" id="canvas-hint">Clique sur un vêtement,<br>puis déplace-le.</div>
        </div>
        <div class="editor-inventory">
          <h3 style="margin-bottom: 12px; color: var(--accent-brown); font-size:1rem;">Vêtements propres</h3>
          <div id="inventory-list"></div>
        </div>
      </div>
    </div>

    <!-- Onglet Ajouter -->
    <div id="tab-add" class="tab-content">
      <div class="form-container">
        <form id="add-form" onsubmit="saveItem(event)">
          <div class="form-group">
            <label>Nom du vêtement</label>
            <input type="text" id="item-name" placeholder="ex : Pull torsadé beige" required>
          </div>
          <div class="form-group">
            <label>Catégorie</label>
            <select id="item-category" required>
              <option value="Haut">Haut (T-shirt, Pull, Chemise...)</option>
              <option value="Bas">Bas (Pantalon, Jupe, Short...)</option>
              <option value="Chaussures">Chaussures</option>
              <option value="Manteau">Manteau / Veste</option>
              <option value="Accessoire">Accessoire (Sac, Bijoux...)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description (optionnel)</label>
            <textarea id="item-desc" rows="2" placeholder="Matière, couleur, saison..."></textarea>
          </div>
          <div class="form-group">
            <label>Photo</label>
            <input type="file" id="item-photo" accept="image/*" required>
          </div>
          <button type="submit" class="btn-primary" id="btn-save">Ajouter au cloud</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODULES FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      doc, 
      updateDoc, 
      deleteDoc, 
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Clés de configuration de ton projet
    const firebaseConfig = {
      apiKey: "AIzaSyCChFpWShbuLd7ejME5mlrtQpZwEvANeJw",
      authDomain: "mon-dressing-e28c1.firebaseapp.com",
      projectId: "mon-dressing-e28c1",
      storageBucket: "mon-dressing-e28c1.firebasestorage.app",
      messagingSenderId: "853352530156",
      appId: "1:853352530156:web:1044b07da524bd973625c9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let clothes = [];
    let currentFilter = 'all';

    window.loginWithGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => alert("Erreur de connexion : " + err.message));
    };

    window.handleEmailAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
          } catch (createErr) {
            alert("Erreur lors de la création du compte : " + createErr.message);
          }
        } else {
          alert("Erreur d'authentification : " + err.message);
        }
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        await loadUserClothes();
      } else {
        currentUser = null;
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    async function loadUserClothes() {
      if (!currentUser) return;
      const q = query(collection(db, "clothes"), where("userId", "==", currentUser.uid));
      const querySnapshot = await getDocs(q);
      clothes = [];
      querySnapshot.forEach((doc) => {
        clothes.push({ id: doc.id, ...doc.data() });
      });
      renderDressing();
    }

    window.saveItem = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.innerText = "Compression & Envoi...";
      btn.disabled = true;

      const name = document.getElementById('item-name').value;
      const category = document.getElementById('item-category').value;
      const desc = document.getElementById('item-desc').value;
      const fileInput = document.getElementById('item-photo');

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const resizedImage = await compressImage(file, 600);

        const newItem = {
          userId: currentUser.uid,
          name,
          category,
          desc,
          photo: resizedImage,
          isDirty: false,
          createdAt: Date.now()
        };

        const docRef = await addDoc(collection(db, "clothes"), newItem);
        clothes.push({ id: docRef.id, ...newItem });
        
        document.getElementById('add-form').reset();
        btn.innerText = "Ajouter au cloud";
        btn.disabled = false;
        switchTab('dressing');
      }
    };

    function compressImage(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }

    window.toggleStatus = async (id) => {
      const item = clothes.find(i => i.id === id);
      if (!item) return;
      item.isDirty = !item.isDirty;
      renderDressing();
      await updateDoc(doc(db, "clothes", id), { isDirty: item.isDirty });
    };

    window.deleteItem = async (id) => {
      if (confirm("Supprimer définitivement ce vêtement ?")) {
        clothes = clothes.filter(i => i.id !== id);
        renderDressing();
        await deleteDoc(doc(db, "clothes", id));
      }
    };

    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'dressing') renderDressing();
      if (tabId === 'editor') renderEditorInventory();
    };

    window.filterItems = (category, btn) => {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDressing();
    };

    function renderDressing() {
      const grid = document.getElementById('clothes-grid');
      grid.innerHTML = '';

      let filtered = clothes;
      if (currentFilter === 'dirty') {
        filtered = clothes.filter(i => i.isDirty);
      } else if (currentFilter !== 'all') {
        filtered = clothes.filter(i => i.category === currentFilter);
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 30px;">Aucun vêtement trouvé.</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="badge ${item.isDirty ? 'dirty' : 'clean'}">${item.isDirty ? 'Au sale' : 'Propre'}</span>
          <img src="${item.photo}" alt="${item.name}">
          <div class="card-body">
            <div class="card-title">${item.name}</div>
            <div class="card-desc">${item.category} ${item.desc ? '• ' + item.desc : ''}</div>
            <div class="card-actions">
              <button onclick="toggleStatus('${item.id}')">${item.isDirty ? '✔ Lavé' : '🧺 Au sale'}</button>
              <button class="btn-delete" onclick="deleteItem('${item.id}')">🗑️</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderEditorInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';
      
      const available = clothes.filter(i => !i.isDirty);
      if(available.length === 0) {
         list.innerHTML = '<p style="font-size:0.85rem; color:gray;">Aucun vêtement disponible.</p>';
         return;
      }

      available.forEach(item => {
        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.innerHTML = `
          <img src="${item.photo}">
          <div style="font-size:0.9rem; font-weight:500;">${item.name}</div>
        `;
        div.onclick = () => addToCanvas(item);
        list.appendChild(div);
      });
    }

    function addToCanvas(item) {
      document.getElementById('canvas-hint').style.display = 'none';
      const canvas = document.getElementById('editor-canvas');
      
      const el = document.createElement('div');
      el.className = 'canvas-item';
      el.style.left = (canvas.offsetWidth / 2 - 70) + 'px';
      el.style.top = (canvas.offsetHeight / 2 - 70) + 'px';

      el.innerHTML = `
        <div class="canvas-item-close" onclick="this.parentElement.remove(); if(document.querySelectorAll('.canvas-item').length === 0) document.getElementById('canvas-hint').style.display = 'block';">×</div>
        <img src="${item.photo}">
      `;
      
      canvas.appendChild(el);
      makeDraggable(el);
    }

    function makeDraggable(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      elmnt.onmousedown = dragMouseDown;
      elmnt.ontouchstart = dragTouchStart;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function dragTouchStart(e) {
        pos3 = e.touches[0].clientX;
        pos4 = e.touches[0].clientY;
        document.ontouchend = closeDragElement;
        document.ontouchmove = elementDragTouch;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function elementDragTouch(e) {
        pos1 = pos3 - e.touches[0].clientX;
        pos2 = pos4 - e.touches[0].clientY;
        pos3 = e.touches[0].clientX;
        pos4 = e.touches[0].clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        document.ontouchend = null;
        document.ontouchmove = null;
      }
    }
  </script>
