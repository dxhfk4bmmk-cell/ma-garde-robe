<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon App</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Mon App V2</h1>
  <textarea id="notes" placeholder="Écris quelque chose..."></textarea>

  <script>
    const txt = document.getElementById('notes');
    txt.value = localStorage.getItem('mon_texte') || '';
    txt.addEventListener('input', () => {
      localStorage.setItem('mon_texte', txt.value);
    });
  </script>
</body>
</html>
