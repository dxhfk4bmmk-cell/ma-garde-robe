<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classeur Pokémon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-binder: #1e232a;
      --page-bg: rgba(255, 255, 255, 0.05);
      --sleeve-bg: rgba(255, 255, 255, 0.07);
      --sleeve-border: rgba(255, 255, 255, 0.15);
      --accent-gold: #ffcb05;
      --accent-blue: #3b4cca;
      --text-light: #f0f4f8;
      --text-muted: #94a3b8;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-binder);
      background-image: radial-gradient(circle at 50% 50%, #2a313d 0%, #171a1f 100%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-shadow: 0 2px 10px rgba(255, 203, 5, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-btns { display: flex; gap: 10px; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-light);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-gold), #e6b800);
      color: #111;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 203, 5, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 203, 5, 0.4);
    }

    /* CLASSEUR & FEUILLET */
    .binder-container {
      background: var(--page-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Anneaux du classeur */
    .binder-rings {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
      padding: 0 40px;
    }
    .ring {
      width: 18px;
      height: 35px;
      background: linear-gradient(135deg, #d1d5db, #6b7280, #374151);
      border-radius: 10px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 8px rgba(0,0,0,0.6);
    }

    /* Grille 3x3 des poches du classeur */
    .binder-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) {
      .binder-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .binder-grid { grid-template-columns: 1fr; }
    }

    /* Poche en plastique transparent */
    .pocket {
      background: var(--sleeve-bg);
      border: 1.5px solid var(--sleeve-border);
      border-radius: var(--radius-md);
      aspect-ratio: 2.5 / 3.5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.03), 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, border-color 0.3s;
    }
    .pocket:hover {
      border-color: rgba(255, 203, 5, 0.5);
      transform: translateY(-4px);
    }

    /* Effet reflet plastique de la pochette */
    .pocket::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 55%
      );
      pointer-events: none;
      z-index: 3;
    }

    .pocket-empty {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 10px;
    }

    /* Image de la Carte */
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: calc(var(--radius-md) - 2px);
      z-index: 1;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 25px 10px 10px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .card-title { font-size: 0.85rem; font-weight: 600; color: #fff; }
    .card-sub { font-size: 0.7rem; color: var(--accent-gold); }

    .btn-delete-card {
      background: rgba(194, 109, 92, 0.8);
      color: #fff;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-delete-card:hover { background: #c26d5c; }

    /* MODAL FORMULAIRE AJOUT */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #252b35;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-lg);
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-content h2 { margin-bottom: 20px; color: var(--accent-gold); }

    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-family: inherit;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Mon Classeur Pokémon</h1>
    <div class="header-btns">
      <button class="btn-secondary" onclick="window.location.href='index.html'">← Retour aux Projets</button>
      <button class="btn-primary" id="btn-add-card-trigger" style="display: none;" onclick="openModal()">+ Ajouter une Carte</button>
    </div>
  </header>

  <div class="binder-container">
    <div class="binder-rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>

    <div class="binder-grid" id="binder-grid">
      <!-- Les 9 poches seront générées ici -->
    </div>
  </div>

  <!-- MODAL D'AJOUT (RESERVÉ ADMIN) -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2>Ajouter une Carte Pokémon</h2>
      <form id="add-card-form" onsubmit="savePokemonCard(event)">
        <div class="form-group">
          <label>Nom du Pokémon</label>
          <input type="text" id="card-name" placeholder="ex : Dracaufeu VMAX" required>
        </div>
        <div class="form-group">
          <label>Set / Extension (Optionnel)</label>
          <input type="text" id="card-set" placeholder="ex : Épée et Bouclier">
        </div>
        <div class="form-group">
          <label>Photo de la Carte</label>
          <input type="file" id="card-photo" accept="image/*" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn-primary" style="flex:1;" id="btn-save-card">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCChFpWShbuLd7ejME5mlrtQpZwEvANeJw",
      authDomain: "mon-dressing-e28c1.firebaseapp.com",
      projectId: "mon-dressing-e28c1",
      storageBucket: "mon-dressing-e28c1.firebasestorage.app",
      messagingSenderId: "853352530156",
      appId: "1:853352530156:web:1044b07da524bd973625c9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // =========================================================
    // METS TON E-MAIL EXACT ICI :
    // Seul cet e-mail pourra voir le bouton et ajouter/supprimer des cartes.
    // =========================================================
    const ADMIN_EMAIL = "timothee.gasparotto@gmail.com";

    let isAdmin = false;
    let pokemonCards = [];

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        isAdmin = true;
        document.getElementById('btn-add-card-trigger').style.display = 'block';
      } else {
        isAdmin = false;
        document.getElementById('btn-add-card-trigger').style.display = 'none';
      }
      await loadPokemonCards();
    });

    async function loadPokemonCards() {
      try {
        const q = query(collection(db, "pokemon_cards"));
        const querySnapshot = await getDocs(q);
        pokemonCards = [];
        querySnapshot.forEach((doc) => {
          pokemonCards.push({ id: doc.id, ...doc.data() });
        });
        renderBinder();
      } catch (err) {
        console.error("Erreur de chargement : ", err);
      }
    }

    function renderBinder() {
      const grid = document.getElementById('binder-grid');
      grid.innerHTML = '';

      // On affiche au minimum 9 emplacements (style page de classeur)
      const totalSlots = Math.max(9, Math.ceil((pokemonCards.length || 1) / 9) * 9);

      for (let i = 0; i < totalSlots; i++) {
        const card = pokemonCards[i];
        const pocket = document.createElement('div');
        pocket.className = 'pocket';

        if (card) {
          pocket.innerHTML = `
            <img src="${card.photo}" class="card-img" alt="${card.name}">
            <div class="card-info">
              <div>
                <div class="card-title">${card.name}</div>
                ${card.set ? `<div class="card-sub">${card.set}</div>` : ''}
              </div>
              ${isAdmin ? `<button class="btn-delete-card" onclick="deleteCard('${card.id}')">×</button>` : ''}
            </div>
          `;
        } else {
          pocket.innerHTML = `<div class="pocket-empty">Emplacement<br>vide</div>`;
        }

        grid.appendChild(pocket);
      }
    }

    window.openModal = () => {
      document.getElementById('add-modal').style.display = 'flex';
    };

    window.closeModal = () => {
      document.getElementById('add-modal').style.display = 'none';
      document.getElementById('add-card-form').reset();
    };

    window.savePokemonCard = async (e) => {
      e.preventDefault();
      if (!isAdmin) return alert("Seul l'administrateur peut ajouter des cartes !");

      const btn = document.getElementById('btn-save-card');
      btn.innerText = "Traitement...";
      btn.disabled = true;

      const name = document.getElementById('card-name').value;
      const set = document.getElementById('card-set').value;
      const fileInput = document.getElementById('card-photo');

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const resizedImage = await compressImage(file, 600);

        const newCard = {
          name,
          set,
          photo: resizedImage,
          createdAt: Date.now()
        };

        const docRef = await addDoc(collection(db, "pokemon_cards"), newCard);
        pokemonCards.push({ id: docRef.id, ...newCard });

        closeModal();
        renderBinder();
      }

      btn.innerText = "Enregistrer";
      btn.disabled = false;
    };

    window.deleteCard = async (id) => {
      if (!isAdmin) return;
      if (confirm("Supprimer cette carte du classeur ?")) {
        pokemonCards = pokemonCards.filter(c => c.id !== id);
        renderBinder();
        await deleteDoc(doc(db, "pokemon_cards", id));
      }
    };

    function compressImage(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
        };
      });
    }
  </script>
</body>
</html>
