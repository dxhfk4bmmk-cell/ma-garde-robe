<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classeur Pokémon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121519;
      --binder-cover: #1c2128;
      --page-bg: #222730;
      --sleeve-bg: rgba(255, 255, 255, 0.03);
      --sleeve-border: rgba(255, 255, 255, 0.18);
      --accent-gold: #ffcb05;
      --accent-blue: #3b4cca;
      --text-light: #f0f4f8;
      --text-muted: #8b98a5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 30%, #1a222d 0%, #0d0f12 100%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-shadow: 0 2px 10px rgba(255, 203, 5, 0.25);
    }

    .header-btns { display: flex; gap: 10px; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-gold), #e6b800);
      color: #111;
      border: none;
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 203, 5, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 203, 5, 0.4);
    }

    /* CONTROLEUR DE NAVIGATION (PAGES) */
    .page-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .page-indicator {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 1px;
    }

    .btn-page {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-page:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .btn-page:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* LE CLASSEUR OUVERT (LIVRE) */
    .binder-book {
      width: 100%;
      max-width: 1100px;
      background: var(--binder-cover);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
      position: relative;
      perspective: 1500px;
    }

    .binder-pages-container {
      display: flex;
      gap: 0;
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* PAGE INDIVIDUELLE (GAUCHE / DROITE) */
    .binder-page {
      flex: 1;
      background: var(--page-bg);
      background-image: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.1) 100%);
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      position: relative;
    }

    /* Reliure centrale et anneaux */
    .binder-spine {
      width: 40px;
      background: linear-gradient(90deg, #15181e 0%, #2a303c 50%, #15181e 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 40px 0;
      z-index: 10;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .ring {
      width: 32px;
      height: 14px;
      background: linear-gradient(180deg, #e5e7eb 0%, #9ca3af 40%, #4b5563 80%, #1f2937 100%);
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
    }

    /* POCHETTE EN PLASTIQUE TRANSPARENT */
    .pocket {
      aspect-ratio: 2.5 / 3.5;
      background: var(--sleeve-bg);
      border: 1px solid var(--sleeve-border);
      border-radius: var(--radius-sm);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 3px rgba(0, 0, 0, 0.4),
        0 4px 10px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(1px);
      transition: transform 0.2s, border-color 0.2s;
    }

    /* Ouverture haute de la pochette plastique (couture) */
    .pocket::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      z-index: 4;
    }

    /* Reflet de brillance plastique */
    .pocket-shine {
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        135deg,
        transparent 42%,
        rgba(255, 255, 255, 0.08) 47%,
        rgba(255, 255, 255, 0.15) 50%,
        transparent 53%
      );
      pointer-events: none;
      z-index: 3;
    }

    .pocket-empty {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.2);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      user-select: none;
    }

    /* CARTE DANS LA POCHETTE */
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: calc(var(--radius-sm) - 2px);
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 8px 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pocket:hover .card-overlay { opacity: 1; }

    .card-name { font-size: 0.75rem; font-weight: 600; color: #fff; line-height: 1.2; }
    .card-set { font-size: 0.65rem; color: var(--accent-gold); }

    .btn-delete-card {
      background: #c26d5c;
      color: white;
      border: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1c2128;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 25px;
      width: 100%;
      max-width: 420px;
    }
    .modal-content h2 { margin-bottom: 18px; color: var(--accent-gold); font-size: 1.2rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-family: inherit;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    /* RESPONSIVE : Sur mobile, afficher 1 page à la fois */
    @media (max-width: 768px) {
      .binder-pages-container { flex-direction: column; }
      .binder-spine { width: 100%; height: 20px; flex-direction: row; padding: 0 30px; }
      .ring { width: 14px; height: 24px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Mon Classeur Pokémon</h1>
    <div class="header-btns">
      <button class="btn-secondary" onclick="window.location.href='index.html'">← Projets</button>
      <button class="btn-primary" id="btn-add-trigger" style="display: none;" onclick="openModal()">+ Ajouter une Carte</button>
    </div>
  </header>

  <!-- NAVIGATION ENTRE LES PAGES DU LIVRE -->
  <div class="page-controls">
    <button class="btn-page" id="btn-prev-page" onclick="changePage(-1)">◀ Page précédente</button>
    <div class="page-indicator" id="page-indicator">PAGE 1 / 1</div>
    <button class="btn-page" id="btn-next-page" onclick="changePage(1)">Page suivante ▶</button>
  </div>

  <!-- LIVRE CLASSEUR -->
  <div class="binder-book">
    <div class="binder-pages-container">
      <!-- PAGE GAUCHE (9 poches) -->
      <div class="binder-page" id="page-left"></div>

      <!-- RELIURE ET ANNEAUX -->
      <div class="binder-spine">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>

      <!-- PAGE DROITE (9 poches) -->
      <div class="binder-page" id="page-right"></div>
    </div>
  </div>

  <!-- MODAL D'AJOUT -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2>Nouvelle Carte Pokémon</h2>
      <form id="add-card-form" onsubmit="savePokemonCard(event)">
        <div class="form-group">
          <label>Nom du Pokémon</label>
          <input type="text" id="card-name" placeholder="ex : Pikachu VMAX" required>
        </div>
        <div class="form-group">
          <label>Set / Extension</label>
          <input type="text" id="card-set" placeholder="ex : Célébrations">
        </div>
        <div class="form-group">
          <label>Photo de la carte</label>
          <input type="file" id="card-photo" accept="image/*" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn-primary" style="flex:1;" id="btn-save-card">Glisser dans le classeur</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCChFpWShbuLd7ejME5mlrtQpZwEvANeJw",
      authDomain: "mon-dressing-e28c1.firebaseapp.com",
      projectId: "mon-dressing-e28c1",
      storageBucket: "mon-dressing-e28c1.firebasestorage.app",
      messagingSenderId: "853352530156",
      appId: "1:853352530156:web:1044b07da524bd973625c9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // =========================================================
    // METS TON E-MAIL EXACT ICI :
    // =========================================================
    const ADMIN_EMAIL = "votre-email@gmail.com";

    let isAdmin = false;
    let pokemonCards = [];
    let currentPage = 1; // 1 double-page = 18 cartes (9 gauche, 9 droite)
    const CARDS_PER_DOUBLE_PAGE = 18;

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        isAdmin = true;
        document.getElementById('btn-add-trigger').style.display = 'block';
      } else {
        isAdmin = false;
        document.getElementById('btn-add-trigger').style.display = 'none';
      }
      await loadPokemonCards();
    });

    async function loadPokemonCards() {
      try {
        const q = query(collection(db, "pokemon_cards"));
        const querySnapshot = await getDocs(q);
        pokemonCards = [];
        querySnapshot.forEach((doc) => {
          pokemonCards.push({ id: doc.id, ...doc.data() });
        });
        renderBinder();
      } catch (err) {
        console.error("Erreur de chargement :", err);
      }
    }

    function renderBinder() {
      const pageLeft = document.getElementById('page-left');
      const pageRight = document.getElementById('page-right');
      pageLeft.innerHTML = '';
      pageRight.innerHTML = '';

      const totalDoublePages = Math.max(1, Math.ceil(pokemonCards.length / CARDS_PER_DOUBLE_PAGE));
      if (currentPage > totalDoublePages) currentPage = totalDoublePages;

      document.getElementById('page-indicator').innerText = `PAGES ${currentPage * 2 - 1}-${currentPage * 2} / ${totalDoublePages * 2}`;
      document.getElementById('btn-prev-page').disabled = (currentPage === 1);
      document.getElementById('btn-next-page').disabled = (currentPage === totalDoublePages);

      const startIndex = (currentPage - 1) * CARDS_PER_DOUBLE_PAGE;

      // Génération de la page gauche (9 poches : index 0 à 8)
      for (let i = 0; i < 9; i++) {
        const cardIndex = startIndex + i;
        pageLeft.appendChild(createPocket(pokemonCards[cardIndex]));
      }

      // Génération de la page droite (9 poches : index 9 à 17)
      for (let i = 9; i < 18; i++) {
        const cardIndex = startIndex + i;
        pageRight.appendChild(createPocket(pokemonCards[cardIndex]));
      }
    }

    function createPocket(card) {
      const pocket = document.createElement('div');
      pocket.className = 'pocket';

      const shine = document.createElement('div');
      shine.className = 'pocket-shine';
      pocket.appendChild(shine);

      if (card) {
        pocket.innerHTML += `
          <img src="${card.photo}" class="card-img" alt="${card.name}">
          <div class="card-overlay">
            <div>
              <div class="card-name">${card.name}</div>
              ${card.set ? `<div class="card-set">${card.set}</div>` : ''}
            </div>
            ${isAdmin ? `<button class="btn-delete-card" onclick="deleteCard('${card.id}')">×</button>` : ''}
          </div>
        `;
      } else {
        pocket.innerHTML += `<div class="pocket-empty">Vide</div>`;
      }

      return pocket;
    }

    window.changePage = (direction) => {
      currentPage += direction;
      renderBinder();
    };

    window.openModal = () => {
      document.getElementById('add-modal').style.display = 'flex';
    };

    window.closeModal = () => {
      document.getElementById('add-modal').style.display = 'none';
      document.getElementById('add-card-form').reset();
    };

    window.savePokemonCard = async (e) => {
      e.preventDefault();
      if (!isAdmin) return alert("Seul l'administrateur peut ajouter des cartes !");

      const btn = document.getElementById('btn-save-card');
      btn.innerText = "Traitement...";
      btn.disabled = true;

      const name = document.getElementById('card-name').value;
      const set = document.getElementById('card-set').value;
      const fileInput = document.getElementById('card-photo');

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const resizedImage = await compressImage(file, 600);

        const newCard = {
          name,
          set,
          photo: resizedImage,
          createdAt: Date.now()
        };

        const docRef = await addDoc(collection(db, "pokemon_cards"), newCard);
        pokemonCards.push({ id: docRef.id, ...newCard });

        // Aller à la dernière page si la nouvelle carte déborde
        currentPage = Math.ceil(pokemonCards.length / CARDS_PER_DOUBLE_PAGE);

        closeModal();
        renderBinder();
      }

      btn.innerText = "Glisser dans le classeur";
      btn.disabled = false;
    };

    window.deleteCard = async (id) => {
      if (!isAdmin) return;
      if (confirm("Retirer cette carte du classeur ?")) {
        pokemonCards = pokemonCards.filter(c => c.id !== id);
        renderBinder();
        await deleteDoc(doc(db, "pokemon_cards", id));
      }
    };

    function compressImage(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
        };
      });
    }
  </script>
</body>
</html>
